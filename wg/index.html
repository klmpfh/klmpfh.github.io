<style>
:root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --text: #24221e;
    --muted: #6b665c;
    --line: #e3ded3;
    --accent: #2f6b57;
    --accent-soft: #e4efe9;
    color-scheme: light;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #181a19;
        --surface: #212422;
        --text: #e9e6df;
        --muted: #a39e93;
        --line: #343835;
        --accent: #7cc0a4;
        --accent-soft: #233630;
        color-scheme: dark;
    }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 1.0625rem/1.7 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.page {
    max-width: 38rem;
    margin: 0 auto;
    padding: 1.25rem 1.25rem 4rem;
}
.topbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 2.5rem;
}
.lang {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    background: var(--surface);
}
.lang button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 0.8125rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 0.2rem 0.8rem;
    border-radius: 999px;
    cursor: pointer;
}
.lang button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--bg);
}
h1, h2 {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-weight: 600;
    line-height: 1.2;
    text-wrap: balance;
}
h1 {
    font-size: clamp(2rem, 7vw, 2.75rem);
    margin: 0 0 1.25rem;
    letter-spacing: -0.01em;
}
h2 {
    font-size: 1.375rem;
    margin: 2.75rem 0 0.75rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--line);
}
p { margin: 0 0 1rem; text-wrap: pretty; hyphens: auto; }
a { color: var(--accent); text-underline-offset: 0.15em; }
ul.list { margin: 0 0 1rem; padding-left: 1.25rem; }
ul.list li { margin-bottom: 0.25rem; }
.facts {
    list-style: none;
    padding: 0;
    margin: 0 0 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
}
.facts li {
    background: var(--accent-soft);
    color: var(--text);
    border-radius: 0.5rem;
    padding: 0.3rem 0.75rem;
    font-size: 0.9375rem;
    font-weight: 500;
}
figure { margin: 1.5rem 0; }
figure img, figure canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 0.75rem;
    background: var(--line);
}
figure canvas { image-rendering: pixelated; aspect-ratio: 4 / 3; }
figcaption { margin-top: 0.4rem; font-size: 0.875rem; color: var(--muted); }
.sig {
    margin-top: 2rem;
    font-style: italic;
    color: var(--muted);
}
</style>
</head>

    // </data>

    var MAGIC = "WG1";

    // Einfache Codierung (kein Sicherheitsfeature): XOR mit einem aus dem Schlüssel abgeleiteten Zahlenstrom.
    // Muss exakt zu keystream() in build.js passen. Bilder nutzen den Schlüssel "<key>#<id>".
    function keystream(key, length) {
        var h = 2166136261;
        for (var i = 0; i < key.length; i++) {
            h ^= key.charCodeAt(i);
            h = Math.imul(h, 16777619);
        }
        var s = h >>> 0 || 1;
        var out = new Uint8Array(length);
        for (var j = 0; j < length; j++) {
            s ^= s << 13; s >>>= 0;
            s ^= s >>> 17;
            s ^= s << 5; s >>>= 0;
            out[j] = (s ^ key.charCodeAt(j % key.length)) & 255;
        }
        return out;
    }

    // base64 -> Bytes, XOR mit Schlüsselstrom; optional nur die ersten `limit` Bytes.
    function xorBytes(data, key, limit) {
        var bin = "";
        try { bin = atob(data); } catch (e) {}
        var n = limit ? Math.min(limit, bin.length) : bin.length;
        var bytes = new Uint8Array(n);
        var ks = keystream(key, n);
        for (var i = 0; i < n; i++) bytes[i] = bin.charCodeAt(i) ^ ks[i];
        return bytes;
    }

    function decode(data, key) {
        try {
            var text = new TextDecoder("utf-8", { fatal: true }).decode(xorBytes(data, key));
            if (text.slice(0, MAGIC.length) !== MAGIC) return null;
            return JSON.parse(text.slice(MAGIC.length));
        } catch (e) {
            return null;
        }
    }

    // Falscher oder fehlender Schlüssel: Die "entschlüsselten" Zufallsbytes werden zu wortähnlichem
    // Kauderwelsch im normalen Seitenlayout (DE = erste, EN = zweite Hälfte der Daten).
    function scramble(data, key) {
        var bytes = xorBytes(data, key);
        var letters = "eeeeennnniiiisssrrrraaattdhhuullcgmobwfkzpvjäöüy";
        var words = [], w = "";
        for (var i = 0; i < bytes.length; i++) {
            var b = bytes[i];
            if ((b % 7 === 0 && w.length > 1) || w.length >= 11) { words.push(w); w = ""; }
            else w += letters.charAt(b % letters.length);
        }
        if (w) words.push(w);
        while (words.length < 40) words = words.concat(words.length ? words : ["lorem"]);
        var imageIds = Object.keys(IMAGES);

        function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
        function blocksFrom(list) {
            var pos = 0;
            function take(n) {
                var out = list.slice(pos, pos + n);
                pos += n;
                return out.length ? out : ["…"];
            }
            function sentenceText(n) {
                var ws = take(n), text = "", start = true;
                for (var j = 0; j < ws.length; j++) {
                    text += (j ? " " : "") + (start ? cap(ws[j]) : ws[j]);
                    start = ws[j].length % 9 === 0 || (j + 1) % 11 === 0;
                    if (start || j === ws.length - 1) text += ".";
                }
                return text;
            }
            var blocks = [{ t: "h1", x: cap(take(2).join(" ")) }, { t: "facts", x: take(5) }];
            if (imageIds.length) blocks.push({ t: "noise", id: imageIds[0] });
            var paras = [1, 1, 1, 1, 2, 2];
            for (var s = 0; s < paras.length; s++) {
                blocks.push({ t: "h2", x: cap(take(2 + (s % 2)).join(" ")) });
                for (var p = 0; p < paras[s]; p++) blocks.push({ t: "p", x: sentenceText(Math.max(6, Math.floor(list.length / 10))) });
            }
            blocks.push({ t: "sig", x: [cap(take(2).join(" ")), cap(take(1)[0])] });
            return blocks;
        }
        var half = Math.floor(words.length / 2);
        return { de: blocksFrom(words.slice(0, half)), en: blocksFrom(words.slice(half)) };
    }

    function getKey() {
        var params = new URLSearchParams(location.search);
        return params.get("k") || decodeURIComponent(location.hash.replace(/^#/, ""));
    }

    function detectLang() {
        try {
            var saved = localStorage.getItem("wg-lang");
            if (saved === "de" || saved === "en") return saved;
        } catch (e) {}
        var langs = navigator.languages || [navigator.language || ""];
        for (var i = 0; i < langs.length; i++) {
            var l = String(langs[i]).toLowerCase().slice(0, 2);
            if (l === "de" || l === "en") return l;
        }
        return "de";
    }

    function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
    }

    // Inline-Inhalt: entweder ein String oder eine Liste aus Strings und {b}, {i}, {a, h}, {br}.
    function inline(node, x) {
        if (typeof x === "string") { node.appendChild(document.createTextNode(x)); return node; }
        x.forEach(function (seg) {
            if (typeof seg === "string") node.appendChild(document.createTextNode(seg));
            else if (seg.br) node.appendChild(document.createElement("br"));
            else if (seg.b != null) node.appendChild(el("strong", null, seg.b));
            else if (seg.i != null) node.appendChild(el("em", null, seg.i));
            else if (seg.a != null) {
                var a = el("a", null, seg.a);
                if (/^(https?:|mailto:|tel:)/i.test(seg.h)) a.href = seg.h;
                if (/^https?:/i.test(seg.h)) { a.target = "_blank"; a.rel = "noopener"; }
                node.appendChild(a);
            }
        });
        return node;
    }

    // Bilder werden einmal decodiert und als Blob-URL wiederverwendet (z. B. beim Sprachwechsel).
    var imageUrls = {};
    function imageUrl(id, mime) {
        if (!imageUrls[id] && IMAGES[id]) {
            var bytes = xorBytes(IMAGES[id], key + "#" + id);
            imageUrls[id] = URL.createObjectURL(new Blob([bytes], { type: mime }));
        }
        return imageUrls[id];
    }

    // Kauderwelsch-Variante eines Bildes: die falsch decodierten Bytes als Graustufen-Pixel.
    function noiseCanvas(id) {
        var w = 64, h = 48;
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext("2d");
        if (!ctx) return canvas;
        var bytes = xorBytes(IMAGES[id], key + "#" + id, w * h);
        var img = ctx.createImageData(w, h);
        for (var i = 0; i < w * h; i++) {
            var v = bytes.length ? bytes[i % bytes.length] : 128;
            img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
            img.data[i * 4 + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
        return canvas;
    }

    function renderBlocks(root, blocks) {
        blocks.forEach(function (b) {
            if (b.t === "h1") {
                root.appendChild(el("h1", null, b.x));
                document.title = b.x;
            } else if (b.t === "h2") {
                root.appendChild(el("h2", null, b.x));
            } else if (b.t === "facts") {
                var ul = el("ul", "facts");
                b.x.forEach(function (f) { ul.appendChild(el("li", null, f)); });
                root.appendChild(ul);
            } else if (b.t === "ul") {
                var list = el("ul", "list");
                b.x.forEach(function (item) { list.appendChild(inline(el("li"), item)); });
                root.appendChild(list);
            } else if (b.t === "img" || b.t === "noise") {
                var fig = el("figure");
                if (b.t === "img") {
                    var img = el("img");
                    img.src = imageUrl(b.id, b.mime);
                    img.alt = b.alt || "";
                    fig.appendChild(img);
                    if (b.cap) fig.appendChild(el("figcaption", null, b.cap));
                } else {
                    fig.appendChild(noiseCanvas(b.id));
                }
                root.appendChild(fig);
            } else if (b.t === "sig") {
                var p = el("p", "sig");
                b.x.forEach(function (line, i) {
                    if (i) p.appendChild(document.createElement("br"));
                    p.appendChild(document.createTextNode(line));
                });
                root.appendChild(p);
            } else {
                root.appendChild(inline(el("p"), b.x));
            }
        });
    }

    var key = getKey();
    var content = decode(DATA, key) || scramble(DATA, key);

    var buttons = document.querySelectorAll(".lang button");
    function setLang(lang) {
        document.documentElement.lang = lang;
        var root = document.getElementById("content");
        root.textContent = "";
        renderBlocks(root, content[lang] || content.de);
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].setAttribute("aria-pressed", String(buttons[i].getAttribute("data-lang") === lang));
        }
    }
    for (var i = 0; i < buttons.length; i++) {
        buttons[i].addEventListener("click", function () {
            var lang = this.getAttribute("data-lang");
            try { localStorage.setItem("wg-lang", lang); } catch (e) {}
            setLang(lang);
        });
    }

    setLang(detectLang());
    document.getElementById("page").hidden = false;
})();
