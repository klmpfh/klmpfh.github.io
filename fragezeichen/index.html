<html lang="de">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: calc(var(--theme-nav-height) + 20px) 16px 20px;
            text-align: center;
            /* weggewischte Cover fliegen seitlich raus, ohne horizontalen Scrollbalken */
            overflow-x: clip;
        }

        .container {
            max-width: 600px;
            width: 100%;
            padding: 24px;
            border: 1px solid var(--theme-border);
            border-radius: var(--theme-radius-lg);
            background-color: var(--theme-surface);
            box-shadow: var(--theme-shadow);
        }

        /* Cover-Stapel: alle Cover liegen in derselben Grid-Zelle übereinander,
           das vorderste mittig, die nächsten schauen rechts hervor. Der Stapel
           reicht bis an den Rahmen (negativer Rand gleicht den Innenabstand aus) */
        .deck {
            container-type: inline-size;
            display: grid;
            justify-items: center;
            margin: 0 -24px 14px;
        }

        .album-card {
            /* Covergröße und wie weit der Stapel rechts neben dem vordersten
               Cover höchstens reicht, beides passend zur Rahmenbreite */
            --cover: min(220px, 50cqw);
            --spread: min(var(--cover) * 0.8, (100cqw - var(--cover)) / 2 - 4px);
            grid-area: 1 / 1;
            position: relative;
            width: var(--cover);
            height: var(--cover);
            border-radius: 10px;
            overflow: hidden;
            background-color: var(--theme-border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, opacity 0.3s ease, filter 0.3s ease;
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
            cursor: grab;
        }

        .album-card img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .album-card .skeleton {
            position: absolute;
            inset: 0;
        }

        /* Hintere Cover: kleiner, nach rechts versetzt und immer dunkler */
        .album-card[data-depth="1"] {
            transform: translateX(calc(var(--cover) * 0.07 + var(--spread) * 0.35)) scale(0.86);
            filter: brightness(0.75);
        }

        .album-card[data-depth="2"] {
            transform: translateX(calc(var(--cover) * 0.13 + var(--spread) * 0.6)) scale(0.74);
            filter: brightness(0.55);
        }

        .album-card[data-depth="3"] {
            transform: translateX(calc(var(--cover) * 0.18 + var(--spread) * 0.81)) scale(0.64);
            filter: brightness(0.4);
        }

        .album-card[data-depth="4"] {
            transform: translateX(calc(var(--cover) * 0.225 + var(--spread))) scale(0.55);
            filter: brightness(0.28);
        }

        /* Startposition für neu hinten eingereihte Cover */
        .album-card[data-depth="5"] {
            transform: translateX(calc(var(--cover) * 0.26 + var(--spread) * 1.2)) scale(0.48);
            filter: brightness(0.15);
            opacity: 0;
        }

        .album-card.dragging {
            transition: none;
            cursor: grabbing;
        }

        .album-card.leaving {
            opacity: 0;
            pointer-events: none;
            transition: transform 0.4s ease-in, opacity 0.4s ease-in;
        }

        .spotify-link {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: var(--theme-accent);
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 50px;
            margin-top: 16px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .spotify-link:hover {
            background-color: var(--theme-accent-strong);
            transform: scale(1.04);
        }

        .spotify-logo {
            width: 28px;
            height: 28px;
        }

        .new-album-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--theme-accent);
            color: #fff;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            padding: 12px 28px;
            border-radius: 50px;
            margin-top: 12px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .new-album-btn:hover {
            background-color: var(--theme-accent-strong);
            transform: scale(1.04);
        }

        .update-note {
            margin-top: 14px;
            font-size: 0.75rem;
            opacity: 0.5;
        }

        .duration-note {
            margin: 0 0 14px;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .album-info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .album-title {
            margin: 0 0 4px;
            font-size: 1rem;
            font-weight: bold;
        }

        /* Platzhalter, solange Cover und Titel laden */
        .skeleton {
            background-color: var(--theme-border);
            animation: skeleton-pulse 1.2s ease-in-out infinite;
        }

        .skeleton-title {
            display: block;
            width: 60%;
            height: 1.2em;
            margin: 0 auto 4px;
            border-radius: 6px;
        }

        .fade-in {
            animation: fade-in 0.25s ease-out;
        }

        @keyframes skeleton-pulse {
            50% { opacity: 0.5; }
        }

        @keyframes fade-in {
            from { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .skeleton,
            .fade-in {
                animation: none;
            }

            .album-card,
            .album-card.leaving {
                transition: none;
            }
        }

        .duration-note.duration-highlight {
            display: inline-block;
            font-weight: bold;
            opacity: 1;
            color: var(--theme-accent-strong);
            background-color: color-mix(in srgb, var(--theme-accent) 15%, transparent);
            padding: 3px 10px;
            border-radius: 20px;
        }
    </style>
</head>

Tracks stillschweigend ausgelassen werden.

            { url: "https://open.spotify.com/embed/album/6UN8m07SmIzyDe63H0oljL", min: 105 }, // Top Secret Edition 2: und das versunkene Schiff
            { url: "https://open.spotify.com/embed/album/4vj4Dq2q7fyvwY7UCj2vin", min: 115 }, // und das Grab der Maya
            { url: "https://open.spotify.com/embed/album/39K0Sczt1mIbW33lB5RNer", min: 89 }, // und die schwarze Katze (Neufassung 2019)
            { url: "https://open.spotify.com/embed/album/7pkVk9UgZBBcc2D2ySHaRM", min: 92 }, // und die singende Schlange (Neufassung)
        ];

        const deck = document.getElementById('deck');
        const albumInfo = document.getElementById('albumInfo');
        const newAlbumBtn = document.getElementById('newAlbumBtn');

        const spotifyLogoSvg = `<svg class="spotify-logo" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.494 17.278a.75.75 0 0 1-1.032.25c-2.824-1.726-6.376-2.116-10.564-1.16a.75.75 0 1 1-.334-1.462c4.582-1.047 8.512-.597 11.68 1.34a.75.75 0 0 1 .25 1.032zm1.466-3.26a.938.938 0 0 1-1.29.308c-3.23-1.985-8.154-2.56-11.974-1.402a.937.937 0 1 1-.544-1.794c4.368-1.325 9.8-.683 13.5 1.598a.937.937 0 0 1 .308 1.29zm.126-3.395c-3.873-2.3-10.262-2.511-13.953-1.39a1.124 1.124 0 1 1-.652-2.151c4.243-1.287 11.297-1.038 15.752 1.608a1.124 1.124 0 0 1-1.147 1.933z"/>
        </svg>`;

        function formatDuration(min, approx) {
            const h = Math.floor(min / 60);
            const m = min % 60;
            const text = h > 0 ? `${h} Std. ${m} Min.` : `${m} Min.`;
            return (approx ? '≈ ' : '') + text;
        }

        // Liste beim Laden einmal mischen (Fisher-Yates)
        const shuffledAlbums = albumLinks.slice();
        for (let i = shuffledAlbums.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledAlbums[i], shuffledAlbums[j]] = [shuffledAlbums[j], shuffledAlbums[i]];
        }
        let nextIndex = 0;

        // Sichtbare Cover, vorderstes zuerst
        const STACK_SIZE = 5;
        const cards = [];

        function takeNextAlbum() {
            // Nächsten Eintrag nehmen, am Ende wieder von vorn
            const album = shuffledAlbums[nextIndex];
            nextIndex = (nextIndex + 1) % shuffledAlbums.length;
            return album;
        }

        function createCard(selectedAlbum) {
            // Embed-URL → Album-ID → direkter Spotify-Link
            const albumId = selectedAlbum.url.split('/album/')[1];
            const spotifyUrl = `https://open.spotify.com/album/${albumId}`;
            const durationText = formatDuration(selectedAlbum.min, selectedAlbum.approx);
            const isUnusualLength = selectedAlbum.min > 90 || selectedAlbum.min < 20;
            const durationClass = isUnusualLength ? 'duration-note duration-highlight' : 'duration-note';

            // Sofort anzeigen: Platzhalter fürs Cover, Titel kommt per oEmbed nach
            const el = document.createElement('div');
            el.className = 'album-card';
            el.innerHTML = '<div class="skeleton"></div>';
            const card = { el, spotifyUrl, durationText, durationClass, title: null };

            // Albumtitel und Coverbild über oEmbed laden
            fetch(`https://open.spotify.com/oembed?url=${spotifyUrl}`)
                .then(r => r.json())
                .then(data => {
                    const img = new Image();
                    img.className = 'fade-in';
                    img.alt = data.title;
                    img.draggable = false;
                    img.src = data.thumbnail_url;
                    // Erst einblenden, wenn das Bild fertig geladen ist
                    return img.decode().catch(() => {}).then(() => ({ data, img }));
                })
                .then(({ data, img }) => {
                    el.replaceChildren(img);
                    card.title = data.title;
                })
                .catch(() => {
                    // Fallback ohne Bild/Titel
                    el.replaceChildren();
                    card.title = '';
                })
                .then(() => {
                    // Titel nachtragen, falls dieses Album schon vorn liegt
                    if (cards[0] === card) showInfo(card);
                });

            return card;
        }

        // Titel, Dauer und Spotify-Link des vordersten Albums unter dem Stapel
        function showInfo(card) {
            albumInfo.innerHTML = `
                ${card.title === null ? '<span class="skeleton skeleton-title"></span>' : ''}
                <p class="${card.durationClass}">${card.durationText}</p>
                <a class="spotify-link" href="${card.spotifyUrl}" target="_blank" rel="noopener">
                    ${spotifyLogoSvg}
                    In Spotify öffnen
                </a>
            `;
            if (card.title) {
                const title = document.createElement('p');
                title.className = 'album-title fade-in';
                title.textContent = card.title;
                albumInfo.prepend(title);
            }
        }

        function layoutCards() {
            cards.forEach((card, depth) => {
                card.el.dataset.depth = depth;
                card.el.style.zIndex = STACK_SIZE - depth;
                // Nur das vorderste Cover lässt sich wegwischen
                card.el.inert = depth > 0;
            });
            showInfo(cards[0]);
        }

        function addCardAtBack(animate) {
            const card = createCard(takeNextAlbum());
            if (animate) {
                // Unsichtbar ganz hinten starten, damit das Cover nach vorn gleitet
                card.el.dataset.depth = STACK_SIZE;
                deck.appendChild(card.el);
                card.el.getBoundingClientRect();
            } else {
                deck.appendChild(card.el);
            }
            cards.push(card);
        }

        // Vorderstes Cover zur Seite rausfliegen lassen (-1 = links, 1 = rechts)
        function dismissFront(direction) {
            const el = cards.shift().el;
            if (drag && drag.card === el) drag = null;
            el.classList.remove('dragging');
            el.classList.add('leaving');
            el.style.zIndex = STACK_SIZE + 1;
            el.style.transform = `translateX(${direction * 200}%) rotate(${direction * 25}deg)`;
            setTimeout(() => el.remove(), 400);

            addCardAtBack(true);
            layoutCards();
        }

        // Wischen mit Finger oder Maus
        let drag = null;

        deck.addEventListener('pointerdown', e => {
            const card = cards[0].el;
            if (e.button !== 0 || !card.contains(e.target)) return;
            drag = { card, id: e.pointerId, startX: e.clientX, dx: 0, active: false, lastX: e.clientX, lastT: e.timeStamp, vx: 0 };
        });

        deck.addEventListener('pointermove', e => {
            if (!drag || e.pointerId !== drag.id) return;
            const dx = e.clientX - drag.startX;
            if (!drag.active) {
                // Kleine Bewegungen zählen noch nicht als Wischen
                if (Math.abs(dx) < 8) return;
                drag.active = true;
                drag.card.classList.add('dragging');
                drag.card.setPointerCapture(e.pointerId);
            }
            const dt = e.timeStamp - drag.lastT;
            if (dt > 0) drag.vx = (e.clientX - drag.lastX) / dt;
            drag.lastX = e.clientX;
            drag.lastT = e.timeStamp;
            drag.dx = dx;
            drag.card.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
        });

        function endDrag(e) {
            if (!drag || e.pointerId !== drag.id) return;
            const { card, active, dx, vx } = drag;
            drag = null;
            if (!active) return;

            // Weit genug gezogen oder schnell genug geschubst?
            const farEnough = Math.abs(dx) > card.offsetWidth * 0.3;
            const flicked = Math.abs(vx) > 0.5 && Math.sign(vx) === Math.sign(dx);
            if (e.type === 'pointerup' && (farEnough || flicked)) {
                dismissFront(Math.sign(dx));
            } else {
                card.classList.remove('dragging');
                card.style.transform = '';
            }
        }

        deck.addEventListener('pointerup', endDrag);
        deck.addEventListener('pointercancel', endDrag);
        deck.addEventListener('dragstart', e => e.preventDefault());

        newAlbumBtn.addEventListener('click', () => dismissFront(-1));

        for (let i = 0; i < STACK_SIZE; i++) addCardAtBack(false);
        layoutCards();
    </script>
